name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-packages:
    runs-on: ubuntu-latest
    env:
      BROWSER_MCP_BROWSER_TESTS: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: npm
      - name: Scan Git history for credentials
        shell: bash
        run: |
          audit_dir="$(mktemp -d)"
          release="https://github.com/gitleaks/gitleaks/releases/download/v8.30.1"
          archive="gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --location --silent --show-error "$release/$archive" -o "$audit_dir/$archive"
          curl --fail --location --silent --show-error "$release/gitleaks_8.30.1_checksums.txt" -o "$audit_dir/checksums.txt"
          (cd "$audit_dir" && sha256sum --check --ignore-missing checksums.txt)
          tar -xzf "$audit_dir/$archive" -C "$audit_dir" gitleaks
          "$audit_dir/gitleaks" git "$GITHUB_WORKSPACE" --redact=100 --no-banner
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build:release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages
          path: |
            dist/*.zip
            dist/SHA256SUMS
